name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per plugin: each is its own module and they must not be able
        # to break each other's build.
        plugin: [contextforge, azure, kubernetes, cloudflare, digitalocean, namecheap, forge, keeper, onepassword, github, vercel]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.plugin }}/go.mod
          cache-dependency-path: ${{ matrix.plugin }}/go.sum

      - name: Verify formatting
        working-directory: ${{ matrix.plugin }}
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        working-directory: ${{ matrix.plugin }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.plugin }}
        run: go test ./...

      # Proves the manifest the host would install is valid, and that the
      # entrypoint actually builds.
      - name: Build installable dist
        working-directory: ${{ matrix.plugin }}
        run: make dist
